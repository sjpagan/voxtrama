# A release page for every version tag pushed to this repository. The notes
# are the CHANGELOG.md entry of that version; alpha, beta and rc tags are
# published as pre-releases.
name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+", "[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notes from CHANGELOG.md
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            $0 ~ "^## " tag "( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no entry for $GITHUB_REF_NAME"; exit 1; }
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-alpha*|*-beta*|*-rc*) pre="--prerelease" ;;
            *) pre="" ;;
          esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Voxtrama $GITHUB_REF_NAME" --notes-file notes.md $pre
