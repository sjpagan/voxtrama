# The usage documentation: how to install and use Voxtrama, for
# people who will not read the code. Sources live in
# docs/guide/. `make docs` builds it into site/ with
# --strict, the same way CI does.
site_name: Voxtrama
site_description: Self-hosted transcription with speaker diarization and recaps whose every point carries a quote you can play back.
site_url: https://sjpagan.github.io/voxtrama/
repo_url: https://github.com/sjpagan/voxtrama
edit_uri: ""
docs_dir: docs/guide
site_dir: site
strict: true

theme:
  name: material
  language: en
  logo: images/logo-mark.png
  favicon: images/favicon.png
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys

nav:
  - Home: index.md
  - Install:
      - Requirements: requirements.md
      - Install on macOS: install-macos.md
      - Install on Linux: install-linux.md
      - Set up the summary model: summary-model-setup.md
      - First start: first-start.md
      - Check the installation: check-installation.md
      - Update, back up, remove: update-remove.md
  - Use:
      - Your first job: first-job.md
      - Start a job: new-job.md
      - Follow a job: follow-a-job.md
      - Read and check the results: results.md
      - Speakers: speakers.md
      - Correct and regenerate: correct-regenerate.md
      - Export: export.md
      - Jobs, search and clean-up: jobs.md
      - Workflows and skills: workflows.md
      - Use cases: use-cases.md
  - Reference:
      - Command line: cli.md
      - Configuration: configuration.md
      - Workflow files: workflow-files.md
      - Settings pages: settings.md
      - Summary models and servers: model-servers.md
      - Privacy and data: privacy.md
      - Taking your data with you: data-portability.md
  - Troubleshooting: troubleshooting.md
  - FAQ: faq.md
