{#
  Inline SVG icons, started for the home page and reused wherever a page
  needs one since (the step chain among them). An icon font loaded from
  anywhere is ruled out, and inline is the
  only other option that ships with no extra request. Each macro is one
  self-contained `<svg>`, coloured by `currentColor` so it matches the
  surrounding text colour.

  Plain line art, not a copy of any icon library's paths:
  redrawing from scratch keeps any licence or provenance question
  away from icons built for this page.
#}
{% macro icon_waveform() %}
<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h2M8 7v10M12 4v16M16 7v10M21 12h-2"/></svg>
{% endmacro %}

{% macro icon_play() %}
<svg viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>
{% endmacro %}

{% macro icon_check() %}
<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>
{% endmacro %}

{% macro icon_laptop() %}
<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="10" rx="1"/><path d="M2 19h20"/></svg>
{% endmacro %}

{% macro icon_cube() %}
<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5L12 12l8-4.5M12 12v9"/></svg>
{% endmacro %}

{% macro icon_lock() %}
<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="1"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
{% endmacro %}

{% macro icon_chevron_right() %}
<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
{% endmacro %}

{# The sidebar's "this section has steps" marker: same signature
   and viewBox as icon_chevron_right(), rotated 90°. It points down while
   Setup's children are shown and never opens or closes anything itself,
   so there is no "up" variant. #}
{% macro icon_chevron_down() %}
<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg>
{% endmacro %}

{% macro icon_settings() %}
<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
{% endmacro %}

{% macro icon_user() %}
<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>
{% endmacro %}

{# A failed step's own marker: the bar and
   the dot drawn as two strokes of the same round-capped line, so the
   "dot" is a zero-length segment rather than a second shape to keep in
   sync with icon_check()'s own stroke width. #}
{% macro icon_alert() %}
<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v6M12 17h.01"/></svg>
{% endmacro %}

{# A skipped step's own marker: never run, so neither icon_check()
   nor icon_alert() would tell the truth about it. #}
{% macro icon_minus() %}
<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14"/></svg>
{% endmacro %}

{# The sidebar's own icon for "Workflows": three steps converging,
   plain line art like every other icon here rather than a copy of any
   library's glyph (icon_waveform()'s own docstring on why). #}
{# The Home entry and the brand's destination. #}
{% macro icon_home() %}
<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/><path d="M10 20v-6h4v6"/></svg>
{% endmacro %}

{% macro icon_workflow() %}
<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="2"/><circle cx="5" cy="18" r="2"/><circle cx="18" cy="12" r="2"/><path d="M7 6h4a4 4 0 0 1 4 4M7 18h4a4 4 0 0 0 4-4"/></svg>
{% endmacro %}

{# The back link's own marker ("← All runs"): a plain arrow, sized and coloured like every icon here. #}
{% macro icon_arrow_left() %}
<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
{% endmacro %}

{# A profile card's own "Download size" figure. #}
{% macro icon_download() %}
<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>
{% endmacro %}

{# A profile card's own "per hour of audio" figure:
   plain line art, not a copy of any icon library's bolt (icon_waveform()'s own docstring
   on why). #}
{% macro icon_bolt() %}
<svg viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" stroke="none"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>
{% endmacro %}

{% macro icon_x() %}
<svg class="vx-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
{% endmacro %}

{# A profile card's own "Remove" command: a plain line-art bin,
   not a copy of any icon library's glyph (icon_waveform()'s own docstring
   on why). #}
{# The transcript's own search field:
   a plain line-art magnifying glass, not a copy of any icon library's
   glyph (icon_waveform()'s own docstring on why). #}
{% macro icon_search() %}
<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="6"/><path d="M20 20l-5.5-5.5"/></svg>
{% endmacro %}

{% macro icon_trash() %}
<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/><path d="M10 11v6M14 11v6"/></svg>
{% endmacro %}

{# The custom player's own pause state: the same two-stroke shape
   as icon_play(), swapped once static/js/run_player.js's own toggle sees
   the <audio> element playing. #}
{% macro icon_pause() %}
<svg viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
{% endmacro %}

{# The custom player's own volume control: plain line art, not a
   copy of any icon library's speaker glyph (icon_waveform()'s own
   docstring on why). #}
{% macro icon_volume() %}
<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h4l5 4V6l-5 4z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg>
{% endmacro %}

{# A "Concept" output card's own marker (its own per-type icon):
   plain line art, not a copy of any icon
   library's bulb (icon_waveform()'s own docstring on why). #}
{% macro icon_concept() %}
<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M8 14a5 5 0 1 1 8 0c-.8.9-1.3 1.6-1.3 2.5h-5.4c0-.9-.5-1.6-1.3-2.5z"/></svg>
{% endmacro %}

{# A "Theme" output card's own marker: three lines converging, distinct
   from icon_workflow()'s own converging circles. #}
{% macro icon_theme() %}
<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h13"/></svg>
{% endmacro %}

{# A "Key point" output card's own marker: a plain bookmark. #}
{% macro icon_key_point() %}
<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
{% endmacro %}
