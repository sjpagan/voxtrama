# x86_64 with an NVIDIA GPU visible to torch as "cuda". Two conditions
# declared: more specific than the generic file, less than Apple Silicon's
# three (unified_memory does not apply to a discrete GPU, so it stays
# undeclared here rather than forced to false).
name: x86-cuda
description: >
  x86_64 machine with an NVIDIA GPU visible to torch as "cuda".
applies_to:
  architecture: x86_64
  accelerator: cuda

asr:
  device: cuda
  # On a GPU, int8_float16 is used for "high",
  # unlike every CPU-only file here which stays at int8 for all three.
  profiles:
    low:
      model_size: small
      compute_type: int8
    base:
      model_size: medium
      compute_type: int8
    high:
      model_size: large-v3
      compute_type: int8_float16

diarization:
  # ESTIMATE: torch's CUDA backend is the best-supported of the three, but
  # nobody has measured speechbrain's embedding model on this combination
  # inside Voxtrama specifically.
  device: cuda

chunking:
  # ESTIMATE: a discrete GPU plus a typical multi-core CPU affords more
  # parallel chunks than a CPU-only machine; no throughput measurement
  # backs the exact numbers below.
  parallel_chunks: 4
  cores_per_chunk: 2
  memory:
    # System RAM only: VRAM is a separate pool ASR's device=cuda draws
    # from, and this file does not have a number for it.
    recommended_gib: 16
    warning: >-
      running {parallel_chunks} chunks in parallel is comfortable with about
      {recommended_gib} GiB of system RAM (the GPU's own memory is separate);
      this machine reports {actual_gib} GiB

generative:
  memory:
    # ESTIMATE, and system RAM only, for the same reason as chunking.memory
    # above: Ollama's own VRAM use is not this file's to declare.
    recommended_gib: 16
    warning: >-
      a local generative model alongside transcription is comfortable with
      about {recommended_gib} GiB of system RAM; this machine reports
      {actual_gib} GiB
  # See tuning/generic.yaml's own comment: no
  # CUDA-specific measurement exists yet either.
  timeout_seconds: 1800
