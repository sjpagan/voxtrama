# This workflow is reduced to the steps the 0.1 runs. What became of the
# others the original chain named:
#   - detect_pii: planned for a later release.
#   - human_review: not in the 0.1: an approval flow is out of scope.
#   - validate_evidence: nothing to add: engine.anchoring checks every claim.
#   - export: not a step: the job view exports the recap and the manifest.
name: meeting-decisions
title: Meeting decisions
version: 2.0.0
schema_version: v1
# The description is one line for the person choosing a workflow;
# Nine words each, so the cards read alike side by side.
# What it used to say, for whoever maintains this file:
#   Turns a meeting recording into decisions, owners and deadlines, each
#   traceable back to the audio. Mirrors the example meeting chain,
#   reduced to what the 0.1 runs.
description: Turn a meeting into decisions, owners and next steps.
steps:
  - id: transcribe
    skill: transcribe
    skill_version: 1.0.0
  - id: diarize
    skill: diarize
    skill_version: 1.0.0
    depends_on: [transcribe]
  # Summarize era registrata nel motore (engine.skill_catalog
  # GENERATIVE_SKILL_NAMES la elenca, engine.anchoring ri-ancora le sue
  # citazioni, i test la coprono) e nessun workflow la nominava: codice
  # eseguibile che nessun run poteva raggiungere. Sta prima della skill
  # tematica perche' il riassunto e' il documento che serve subito, e
  # dipende da diarize come lei: chi legge il recap vuole sapere chi parla.
  - id: summarize
    skill: summarize
    skill_version: 1.0.0
    depends_on: [diarize]
  - id: extract_decisions
    skill: extract_decisions
    skill_version: 1.0.0
    depends_on: [diarize]
    # extract_themes produces a different shape (themes, not
    # decisions) but is a reasonable run-level alternative for this step:
    # both read the same transcript and produce a structured, anchored
    # list. Two models, so a run can pick either without a second workflow.
    allows:
      skills:
        - skill: extract_themes
          skill_version: 1.0.0
      models:
        - qwen2.5:0.5b
        - qwen3:30b
