# This workflow is reduced to the steps the 0.1 runs. What became of the
# others the original chain named:
#   - detect_pii: planned for a later release.
#   - extract_quotes: not done: every theme and every point already carries its quote.
#   - human_review: not in the 0.1: the approval flow is excluded.
#   - validate_evidence: nothing to add: engine.anchoring checks every claim.
#   - export: not a step: the job view exports the recap and the manifest.
name: research-interview
title: Research interview
version: 2.0.0
schema_version: v1
# The description is one line for the person choosing a workflow;
# Nine words each, so the cards read alike side by side.
# What it used to say, for whoever maintains this file:
#   Turns a qualitative research interview into themes and insights, each
#   traceable back to the audio, reduced to what the 0.1 runs.
description: Turn an interview into themes tied to the audio.
steps:
  - id: transcribe
    skill: transcribe
    skill_version: 1.0.0
  - id: diarize
    skill: diarize
    skill_version: 1.0.0
    depends_on: [transcribe]
  # Summarize era registrata nel motore (engine.skill_catalog
  # GENERATIVE_SKILL_NAMES la elenca, engine.anchoring ri-ancora le sue
  # citazioni, i test la coprono) e nessun workflow la nominava: codice
  # eseguibile che nessun run poteva raggiungere. Sta prima della skill
  # tematica perche' il riassunto e' il documento che serve subito, e
  # dipende da diarize come lei: chi legge il recap vuole sapere chi parla.
  - id: summarize
    skill: summarize
    skill_version: 1.0.0
    depends_on: [diarize]
  - id: extract_themes
    skill: extract_themes
    skill_version: 1.0.0
    depends_on: [diarize]
